AWSTemplateFormatVersion: "2010-09-09"
Description: "Aurora PostgreSQL for development and production environments"

Parameters:
  NetworkStackName:
    Type: String
    Default: "network"
    Description: "Name of the network stack"
  DBPassword:
    Type: String
    Default: "postgres"
    Description: "Database password"
    NoEcho: true
  DeletionProtection:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable deletion protection for the Aurora cluster"
  DBInstanceClass:
    Type: String
    Default: "db.t3.medium"
    Description: "Aurora instance class"
    AllowedValues:
      - "db.t3.medium"
      - "db.t3.large"
      - "db.r6g.large"
      - "db.r6g.xlarge"
      - "db.r6g.2xlarge"
  BackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: "Number of days to retain backups"
Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "Subnet group for Aurora PostgreSQL"
      SubnetIds:
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1Id"
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet2Id"
      Tags:
        - Key: Name
          Value: "aurora-postgres-subnet-group"

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    Properties:
      DBClusterIdentifier: "cluster"
      Engine: aurora-postgresql
      EngineVersion: "17.5"
      Port: 5432
      DatabaseName: app
      MasterUsername: postgres
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - Fn::ImportValue: !Sub "${NetworkStackName}-RDSSecurityGroupId"
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      StorageEncrypted: true
      DeletionProtection: !Ref DeletionProtection
      EnableCloudwatchLogsExports:
        - postgresql
      PreferredMaintenanceWindow: "sun:18:00-sun:19:00"
      PreferredBackupWindow: "17:00-18:00"
      Tags:
        - Key: Name
          Value: "cluster"

  AuroraInstance1:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: "instance-1"
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: !Ref DBInstanceClass
      Engine: aurora-postgresql
      PubliclyAccessible: false
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: "instance-1"

Outputs:
  ClusterEndpoint:
    Description: "Aurora PostgreSQL Cluster Endpoint (Writer)"
    Value: !GetAtt AuroraCluster.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-ClusterEndpoint"

  ClusterReaderEndpoint:
    Description: "Aurora PostgreSQL Reader Endpoint"
    Value: !GetAtt AuroraCluster.ReadEndpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-ClusterReaderEndpoint"

  ClusterPort:
    Description: "Aurora PostgreSQL Port"
    Value: !GetAtt AuroraCluster.Endpoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-ClusterPort"
