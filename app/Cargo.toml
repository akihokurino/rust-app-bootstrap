[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.53", features = ["full"] }
tracing = { version = "0.1", features = [] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json", "with-uuid"] }
derive_more = { version = "2.1", features = ["full"] }
base-62 = "0.1"
rand = "0.10"
chrono = "0.4"
unicode-segmentation = "1.13"
once_cell = "1.21"
aws-config = "1.10"
aws-sdk-ssm = "1.118"
aws-sdk-s3 = "1.141"
aws-sdk-lambda = "1.138"
aws-sdk-sns = "1.107"
aws-sdk-sqs = "1.105"
aws-sdk-cognitoidentityprovider = "1.127"
aws-sdk-sesv2 = "1.128"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv-parser = "0.1"
bytes = "1.12"
email_address = "0.2"
http = "1.5"
atty = "0.2"
async-graphql = "7.2"
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
cloudfront_sign = "0.4"
base64 = "0.23"
strum = "0.28"
strum_macros = "0.28"
sentry = { version = "0.49", default-features = false, features = ["rustls", "reqwest", "tracing", "panic", "release-health"] }
google-identitytoolkit3 = { version = "7.0", features = ["yup-oauth2-service-account"] }
google-fcm1 = "7.0"